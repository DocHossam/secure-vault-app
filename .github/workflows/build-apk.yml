name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master", "feature/premium-bilingual-ui" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Analyze, Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Unit Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Keep feature-branch builds available from a permanent, clearly marked
      # GitHub pre-release. Main/master release publishing can be added after
      # the project has a reviewed production version and signing setup.
      - name: Publish preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/premium-bilingual-ui'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.0.0-preview.${GITHUB_RUN_NUMBER}"
          gh release create "v${VERSION}" "build/app/outputs/flutter-apk/app-release.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Secure Vault ${VERSION}" \
            --notes "Preview build from feature/premium-bilingual-ui. Run analysis, tests and Android release build passed." \
            --prerelease
